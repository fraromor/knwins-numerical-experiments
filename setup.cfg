# PEP 8 (pycodestyle), PEP 257 (pydocstyle) and pyflakes: `flake8`
[flake8]
max-line-length = 79
docstring-convention = pep257
extend-ignore =
    # constructor arguments are documented in the class docstring (napoleon)
    D107,
    # math notation of the paper: matrices and spaces in upper case (U, H, V)
    N802, N803, N806
exclude = .git, __pycache__, docs/_build

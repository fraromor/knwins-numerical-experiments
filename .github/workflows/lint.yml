name: lint

on:
  push:
  pull_request:

jobs:
  pep8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install flake8 flake8-docstrings pep8-naming
      # PEP 8 and PEP 257, configured in setup.cfg
      - run: flake8 .
